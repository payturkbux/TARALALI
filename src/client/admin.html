<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>TARALALI | لوحة تحكم الإدارة</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bg-admin: #090d16;
            --panel-bg: rgba(30, 41, 59, 0.8);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: var(--bg-admin); color: var(--text-main); min-height: 100vh; padding: 25px; }
        
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); }
        .admin-title { font-size: 24px; font-weight: 800; color: var(--accent-blue); }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .stat-card { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; text-align: center; }
        .stat-number { font-size: 26px; font-weight: 800; color: #fff; margin-top: 5px; }

        .table-container { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 14px; overflow-x: auto; padding: 20px; }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th, td { padding: 14px 16px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        th { color: var(--text-muted); font-weight: 700; background: rgba(15, 23, 42, 0.5); }
        
        .input-inline { width: 90px; padding: 6px; border-radius: 6px; border: 1px solid var(--border-color); background: #0f172a; color: #fff; text-align: center; font-weight: bold; }
        
        .btn-action { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 13px; transition: 0.2s; }
        .btn-save { background: var(--accent-green); color: white; }
        .btn-save:hover { opacity: 0.9; }
        .btn-sub { background: var(--accent-blue); color: white; margin-right: 5px; }

        .hidden { display: none !important; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; }
        .badge-active { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); }
        .badge-expired { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); }
    </style>
</head>
<body>

    <div id="access-denied" class="hidden" style="text-align: center; margin-top: 100px;">
        <h1 style="color: var(--accent-red);">🚫 عذراً! لا تملك صلاحية الوصول للوحة الأدمن</h1>
        <p style="color: var(--text-muted); margin-top: 10px;">يرجى تسجيل الدخول بحساب مسؤول.</p>
        <a href="index.html" style="color: var(--accent-blue); text-decoration: none; margin-top: 15px; display: inline-block;">العودة للرئيسية</a>
    </div>

    <div id="admin-panel" class="hidden">
        <div class="admin-header">
            <div class="admin-title">🛡️ لوحة إدارة منصة ترلالي</div>
            <div>
                <span id="admin-email" style="font-size: 14px; color: var(--text-muted); margin-left: 15px;"></span>
                <button onclick="window.location.href='index.html'" class="btn-action" style="background: #334155; color: #fff;">الرئيسية</button>
            </div>
        </div>

        <!-- الإحصائيات العامة -->
        <div class="stats-grid">
            <div class="stat-card">
                <div style="color: var(--text-muted); font-size: 13px;">إجمالي المستخدمين</div>
                <div class="stat-number" id="stat-total-users">0</div>
            </div>
            <div class="stat-card">
                <div style="color: var(--text-muted); font-size: 13px;">الاشتراكات النشطة</div>
                <div class="stat-number" style="color: var(--accent-green);" id="stat-active-subs">0</div>
            </div>
            <div class="stat-card">
                <div style="color: var(--text-muted); font-size: 13px;">مجموع النقاط المتداولة</div>
                <div class="stat-number" style="color: #f59e0b;" id="stat-total-points">0</div>
            </div>
        </div>

        <!-- جدول إدارة المستخدمين -->
        <div class="table-container">
            <h3 style="margin-bottom: 15px; color: var(--accent-blue);">قائمة المستخدمين والتحكم بالحسابات</h3>
            <table>
                <thead>
                    <tr>
                        <th>البريد الإلكتروني</th>
                        <th>الرصيد (ر.س)</th>
                        <th>النقاط</th>
                        <th>حالة الاشتراك</th>
                        <th>الصلاحية</th>
                        <th>إجراءات التحكم</th>
                    </tr>
                </thead>
                <tbody id="users-table-body">
                    <!-- تُجلب البيانات ديناميكياً -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // ⚠️ ضع هنا فقط المفتاح العادي (Anon Key) الخاص بالعميل - لا تضع Service Key إطلاقاً!
        const SUPABASE_URL = "https://YOUR_SUPABASE_PROJECT_ID.supabase.co"; 
        const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY"; 

        let db = null;

        document.addEventListener("DOMContentLoaded", async () => {
            if (!window.supabase) {
                alert("تعذر تحميل مكتبة Supabase!");
                return;
            }

            db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            const { data: { session } } = await db.auth.getSession();
            if (!session) {
                showDenied();
                return;
            }

            // فحص صلاحية الأدمن من جدول users
            const { data: userRecord, error } = await db.from("users").select("role").eq("id", session.user.id).single();
            if (error || !userRecord || userRecord.role !== "admin") {
                showDenied();
                return;
            }

            document.getElementById("admin-email").innerText = session.user.email;
            document.getElementById("admin-panel").classList.remove("hidden");
            loadAdminData();
        });

        function showDenied() {
            document.getElementById("access-denied").classList.remove("hidden");
            document.getElementById("admin-panel").classList.add("hidden");
        }

        async function loadAdminData() {
            // استدعاء دالة RPC الآمنة لـ الأدمن
            const { data: users, error } = await db.rpc("get_all_users_admin");
            if (error) {
                alert("خطأ في جلب البيانات: " + error.message);
                return;
            }

            let activeSubs = 0;
            let totalPoints = 0;
            const tbody = document.getElementById("users-table-body");
            tbody.innerHTML = "";

            users.forEach(u => {
                const isSubActive = u.subscription_expires_at && new Date(u.subscription_expires_at) > new Date();
                if (isSubActive) activeSubs++;
                totalPoints += (u.points || 0);

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${u.email}</td>
                    <td><input type="number" step="0.01" class="input-inline" id="bal-${u.id}" value="${u.balance || 0}"></td>
                    <td><input type="number" class="input-inline" id="pts-${u.id}" value="${u.points || 0}"></td>
                    <td>
                        <span class="badge ${isSubActive ? 'badge-active' : 'badge-expired'}">
                            ${isSubActive ? 'نشط 🟢' : 'منتهي 🔴'}
                        </span>
                    </td>
                    <td><strong>${u.role || 'user'}</strong></td>
                    <td>
                        <button onclick="updateUserValues('${u.id}')" class="btn-action btn-save">حفظ البيانات</button>
                        <button onclick="add24hSub('${u.id}')" class="btn-action btn-sub">+24h لعب</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById("stat-total-users").innerText = users.length;
            document.getElementById("stat-active-subs").innerText = activeSubs;
            document.getElementById("stat-total-points").innerText = totalPoints;
        }

        // تعديل النقاط والرصيد للمستخدم مباشرة
        async function updateUserValues(userId) {
            const newBalance = parseFloat(document.getElementById(`bal-${userId}`).value);
            const newPoints = parseInt(document.getElementById(`pts-${userId}`).value);

            if (isNaN(newBalance) || isNaN(newPoints)) {
                alert("يرجى إدخال أرقام صحيحة.");
                return;
            }

            const { error } = await db.from("users").update({ balance: newBalance, points: newPoints }).eq("id", userId);
            if (error) {
                alert("فشل التحديث: " + error.message);
            } else {
                alert("تم تحديث حساب المستخدم بنجاح! ✅");
                loadAdminData();
            }
        }

        // منح المستخدم 24 ساعة لعب مجانية من الأدمن
        async function add24hSub(userId) {
            const newExpire = new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString();
            const { error } = await db.from("users").update({ subscription_expires_at: newExpire }).eq("id", userId);
            if (error) {
                alert("فشل التفعيل: " + error.message);
            } else {
                alert("تم منح 24 ساعة لعب للمستخدم! 🎉");
                loadAdminData();
            }
        }
    </script>
</body>
</html>
